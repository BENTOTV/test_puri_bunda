<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FavoriteButton — preview</title></head>
<body>
<div class="mr-row" style="gap:24px">
  <button class="mr-fav" aria-pressed="false" aria-label="Add to favorites"><svg class="mr-i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></button>
  <button class="mr-fav on" aria-pressed="true" aria-label="Remove from favorites"><svg class="mr-i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></button>
  <button class="mr-fav filled-bg on" aria-pressed="true" aria-label="Remove from favorites"><svg class="mr-i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></button>
  <span class="mr-muted" style="font-size:13px">44 × 44 hit area · toggles instantly (optimistic), snackbar "Removed from favorites · Undo"</span>
</div>

</body>
</html>
